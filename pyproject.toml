[project]
name = "apron-saml"
dynamic = ["version"]
description = "Stateless SP-side SAML 2.0 protocol library — AuthnRequest building, metadata, response decoding, and assertion validation."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
dependencies = [
    # XML-security backend (ADR 0001: docs/adr/0001-xml-security-backend.md). Consumed internally
    # behind the ServiceProvider facade; needs the `xmlsec1` CLI binary at runtime for
    # signing/encryption/decryption. Its HTTP helpers are never called (no network I/O here).
    "pysaml2>=7.5,<8",
]

[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "tests" },
]
lint = [
    "pre-commit>=4.5.1",
    "ruff>=0.15.4",
    "ty>=0.0.23",
]
tests = [
    "pytest>=9.0.3",
    "freezegun>=1.5.1",
    "setuptools>=82.0",
    "setuptools-scm[toml]>=10.2.1",
]

[tool.uv]
exclude-newer = "7 days"

[build-system]
requires = ["setuptools>=48", "setuptools_scm[toml]>=10.2.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests", "tests.*"]
namespaces = false

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.setuptools_scm]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that call a real IdP (require APRON_SAML_INTEGRATION_TESTS)",
]
