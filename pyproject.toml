[project]
name = "apron-saml"
dynamic = ["version"]
description = "Stateless SP-side SAML 2.0 protocol library — AuthnRequest building, metadata, response decoding, and assertion validation."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
dependencies = [
    # XML-security backend (ADR 0001: docs/adr/0001-xml-security-backend.md). Consumed internally
    # behind the ServiceProvider facade; needs the `xmlsec1` CLI binary at runtime for
    # signing/encryption/decryption. Its HTTP helpers are never called (no network I/O here).
    "pysaml2>=7.5,<8",
    # Security floors on pysaml2's transitive deps (see #38, #35). A single-package Dependabot
    # bump keeps silently re-resolving uv.lock and rolling a sibling back below its patched
    # version, so the floors are pinned here where a lockfile diff cannot hide them.
    # cryptography: GHSA-537c-gmf6-5ccf (HIGH) — vulnerable OpenSSL bundled in wheels < 48.0.1.
    "cryptography>=48.0.1",
    # pyopenssl: GHSA-5pwr-322w-8jr4 (HIGH) + GHSA-vp96-hxj8-p424, both first patched in 26.0.0.
    # This floor also holds pysaml2 at 7.5.0: 7.5.1+ cap pyopenssl<24.3.0, which would drag
    # cryptography back below 44 and reopen both advisories above.
    "pyopenssl>=26.0.0",
    # defusedxml: already present transitively (pysaml2 parses XML through it, hardening against XXE
    # and entity expansion). We also navigate the metadata XML with it directly to collect every
    # <X509Certificate> in an <X509Data> — pysaml2's object model keeps only the last. Declared here
    # because we import it, not just rely on it transitively.
    "defusedxml>=0.7.1",
    # Pure-Python XSD validator (no lxml/compiled footprint — consistent with ADR 0001). Already pulled
    # in transitively by pysaml2; declared here because we import it directly for the XSW hardened-schema
    # check (#21, ADR 0004). No hard upper cap: a cap in a library propagates resolution conflicts and
    # xmlschema is also a pysaml2 transitive dep; the content-model canary test (test_wrapping) guards
    # against a behavior-breaking future major.
    "xmlschema>=2.5",
]

[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "tests" },
]
lint = [
    "pre-commit>=4.5.1",
    "ruff>=0.15.4",
    "ty>=0.0.23",
]
tests = [
    "pytest>=9.0.3",
    "freezegun>=1.5.1",
    "setuptools>=82.0",
    "setuptools-scm[toml]>=10.2.1",
]

[tool.uv]
exclude-newer = "7 days"

[build-system]
requires = ["setuptools>=48", "setuptools_scm[toml]>=10.2.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests", "tests.*"]
namespaces = false

[tool.setuptools.package-data]
"apron_saml" = ["py.typed", "schemas/*.xsd", "schemas/*.md"]

[tool.setuptools_scm]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that call a real IdP (require APRON_SAML_INTEGRATION_TESTS)",
]
