version: 2
updates:
  # Keeps the SHA-pinned GitHub Actions current (bumps the pin and its `# vX.Y.Z` comment together).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "python:uv"
    groups:
      python:
        patterns: ["*"]
