name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.13"
      - run: uv sync --group lint
      - run: uv run pre-commit run --all-files --verbose

  test:
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # The XML-security backend (Epic 1 ADR) needs a system xmlsec dependency.
      # Uncomment when the backend lands — leaning pysaml2 (runtime `xmlsec1` binary):
      #   - if: runner.os == 'Linux'
      #     run: sudo apt-get update && sudo apt-get install -y xmlsec1
      #   - if: runner.os == 'macOS'
      #     run: brew install libxmlsec1
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --group tests
      - run: uv run pytest tests/ -v
